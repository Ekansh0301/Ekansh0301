<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Ekansh Goyal — Systems, NLP and Computational Linguistics">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d353"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#30363d"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
    <style>
      .name { font: 700 62px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #f0f6fc; }
      .tag  { font: 500 23px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #8b949e; }
      .meta { font: 500 17px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #6e7681; letter-spacing: .5px; }
      .mono { font: 400 19px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #7ee787; }
      .prompt { fill: #58a6ff; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .node { fill: #161b22; stroke: #39d353; stroke-width: 2.5; animation: pulse 4s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { fill: #161b22; } 12% { fill: #39d353; } 30% { fill: #161b22; } }
      .n1 { animation-delay: 0s; }   .n2 { animation-delay: .5s; } .n3 { animation-delay: 1s; }
      .n4 { animation-delay: 1.5s; } .n5 { animation-delay: 2s; }  .n6 { animation-delay: 2.5s; }
      .n7 { animation-delay: 3s; }   .n8 { animation-delay: 3.5s; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)" opacity=".55"/>
    <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

    <text class="name" x="72" y="128">Ekansh Goyal</text>
    <text class="tag" x="74" y="170">Distributed systems · NLP research · Computational linguistics</text>
    <text class="mono" x="74" y="226"><tspan class="prompt">~ $</tspan> build it from scratch, then make it survive failure<tspan class="cursor">▍</tspan></text>
    <text class="meta" x="74" y="272">B.TECH CS + MS COMPUTATIONAL LINGUISTICS  ·  IIIT HYDERABAD  ·  LTRC</text>

    <!-- consistent hash ring: nodes light up as a request walks the ring -->
    <g transform="translate(985 160)">
      <circle r="104" fill="none" stroke="#30363d" stroke-width="2"/>
      <circle r="104" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="70 584">
        <animateTransform attributeName="transform" type="rotate" from="-90" to="270" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle class="node n1" cx="0" cy="-104" r="11"/>
      <circle class="node n2" cx="73.5" cy="-73.5" r="11"/>
      <circle class="node n3" cx="104" cy="0" r="11"/>
      <circle class="node n4" cx="73.5" cy="73.5" r="11"/>
      <circle class="node n5" cx="0" cy="104" r="11"/>
      <circle class="node n6" cx="-73.5" cy="73.5" r="11"/>
      <circle class="node n7" cx="-104" cy="0" r="11"/>
      <circle class="node n8" cx="-73.5" cy="-73.5" r="11"/>
      <text class="meta" x="0" y="6" text-anchor="middle" style="font-size:14px">N=3 · R=2 · W=2</text>
    </g>
  </g>
</svg>
